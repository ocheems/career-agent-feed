name: Secrets Guard

# Independent scan of every push/PR for accidentally committed credentials.
# This runs alongside (not instead of) GitHub's built-in secret scanning +
# push protection. Belt and braces.

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0    # scan the full history, not just the latest commit

      - name: Scan tracked files for credential-shaped strings
        shell: bash
        run: |
          set -e
          echo "Scanning committed files for credential patterns..."
          # Patterns we care about, tuned to be specific enough to avoid
          # matching example env-var NAMES in workflow files.
          #  - Apify tokens start with 'apify_api_' and are ~40+ chars
          #  - AWS access keys start with AKIA/ASIA
          #  - Generic long hex tokens assigned to a value (not a var name)
          #  - .env-style KEY=long-random-value lines
          PATTERNS='(
            apify_api_[A-Za-z0-9]{20,}|
            AKIA[0-9A-Z]{16}|
            ASIA[0-9A-Z]{16}|
            xox[baprs]-[A-Za-z0-9-]{10,}|
            ghp_[A-Za-z0-9]{36}|
            gho_[A-Za-z0-9]{36}|
            (ADZUNA_APP_(ID|KEY)|APIFY_TOKEN|THEIRSTACK_API_KEY|API_KEY|SECRET)[[:space:]]*[:=][[:space:]]*"?[A-Za-z0-9]{20,}
          )'
          # Strip whitespace/newlines from the pattern
          PATTERN=$(echo "$PATTERNS" | tr -d ' \n')

          # Search everything git tracks, except this workflow file itself
          # (since it necessarily mentions the secret names).
          if git ls-files -z \
             | grep -zZv '^\.github/workflows/secrets-guard\.yml$' \
             | xargs -0 grep -InEH "$PATTERN" 2>/dev/null; then
            echo ""
            echo "::error::A credential-shaped string was found in tracked files."
            echo "::error::Remove the value, rotate the key at the provider, and put"
            echo "::error::the new value ONLY in Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          echo "OK: no credential patterns found in tracked files."

      - name: Refuse to commit generated runtime files
        shell: bash
        run: |
          set -e
          BAD=$(git ls-files -- effective_config.yaml 'public/index.html' 2>/dev/null || true)
          if [ -n "$BAD" ]; then
            echo "::error::The following files are generated at run time and must not be committed:"
            echo "$BAD"
            echo "::error::Delete them and confirm .gitignore includes them."
            exit 1
          fi
          echo "OK: no generated runtime files are tracked."
